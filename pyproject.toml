# Tool configuration only: each ROS package has its own setup.py, this is not a Python project.

[tool.ruff]
line-length = 120
# Humble's Python is 3.10 and Jazzy's 3.12; keep code valid for both (ROS_DISTRO is switchable).
target-version = "py310"
extend-exclude = ["sim/worlds/generated", "runs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "BLE", "C4", "SIM", "RUF"]
ignore = [
  "SIM108",  # ternaries are not always clearer
  "RUF001",  # unicode in strings (degree signs, arrows in docs)
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = [
  "inv_bringup", "inv_description", "inv_flight_interface", "inv_interfaces", "inv_inventory",
  "inv_layout", "inv_localization", "inv_mapping", "inv_mission", "inv_perception", "inv_safety",
  "inv_tools", "inv_uplink", "worldgen", "evaluation",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
