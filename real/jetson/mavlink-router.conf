# mavlink-router (/etc/mavlink-router/main.conf). UNTESTED SKELETON.
# The FC's MAVLink port (not the DDS port) -> ground station + local tools.
[General]
TcpServerPort = 5760

[UartEndpoint fc]
Device = /dev/flight_controller        # Pixhawk 6C USB, udev symlink (real/sensors/udev)
Baud = 921600

[UdpEndpoint gcs]
Mode = Normal
Address = 192.168.1.255                # TODO(site): ground station / broadcast address
Port = 14550

[UdpEndpoint local_tools]
Mode = Normal                          # fc_bootstrap / params_diff connect with udpin:127.0.0.1:14551
Address = 127.0.0.1
Port = 14551
