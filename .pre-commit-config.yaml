# Lint and format checks. `just lint` runs them in the dev container; `pre-commit install` on the
# host runs them on every commit. CI runs the same hooks (.github/workflows/ci.yml).
# Hook versions are pinned; `pre-commit autoupdate` bumps them (in a PR of its own).
exclude: ^(sim/worlds/generated/|runs/|bags/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]       # meshes/textures go through Git LFS (.gitattributes)
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        exclude: ^\.devcontainer/devcontainer\.json$  # JSON with comments, as the Dev Container spec allows
      - id: check-xml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c, c++]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: package-xml
        name: package.xml (REP 149 schema, name, build_type)
        entry: python tools/lint/check_package_xml.py
        language: python
        additional_dependencies: [lxml==6.1.3]
        files: (^|/)package\.xml$
