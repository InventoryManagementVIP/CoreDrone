name: docker-publish

# Build the dev image natively on amd64 and arm64 runners, push both by digest, then publish one
# multi-arch tag (<distro> and <distro>-<sha>) plus a registry build cache per architecture.
# Students `docker pull` this instead of compiling ArduPilot (just setup).
#
# First publish: GHCR creates the package as private. Make it public once (org -> Packages ->
# coredrone-dev -> Package settings) so pulls need no login.
on:
  push:
    branches: [main]
    paths:
      - docker/**
      - deps/**
      - drone/src/*/package.xml
      - .github/workflows/docker-publish.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Load build pins (docker/.env)
        run: grep -E '^[A-Z_]+=' docker/.env >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dev.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: ROS_DISTRO=${{ env.ROS_DISTRO }}
          outputs: type=image,name=${{ env.DEV_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.DEV_IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.DEV_IMAGE }}:buildcache-${{ matrix.arch }},mode=max
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Load build pins (docker/.env)
        run: grep -E '^[A-Z_]+=' docker/.env >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-arch tags
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${DEV_IMAGE}:${ROS_DISTRO}" \
            -t "${DEV_IMAGE}:${ROS_DISTRO}-${GITHUB_SHA::7}" \
            $(printf "${DEV_IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${DEV_IMAGE}:${ROS_DISTRO}"
